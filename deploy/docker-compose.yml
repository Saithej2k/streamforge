services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio minio123
        mc mb --ignore-existing local/warehouse

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      - minio
      - minio-init
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"

  flink-jobmanager:
    build:
      context: ..
      dockerfile: deploy/flink/Dockerfile
    command: jobmanager
    depends_on:
      - redpanda
      - iceberg-rest
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ../flink:/opt/streamforge/flink:ro

  flink-taskmanager:
    build:
      context: ..
      dockerfile: deploy/flink/Dockerfile
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 2
    volumes:
      - ../flink:/opt/streamforge/flink:ro

  streamforge:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - redpanda
    volumes:
      - ../examples:/workspace/examples:ro
      - ../build:/workspace/build
    working_dir: /workspace
    entrypoint:
      - /usr/local/bin/streamforge

volumes:
  minio-data:
