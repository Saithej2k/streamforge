[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge-datahub"
version = "0.1.0"
description = "DataHub metadata publisher for StreamForge replay diagnostics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
streamforge-datahub = "streamforge_datahub.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
